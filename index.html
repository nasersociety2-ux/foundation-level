<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المستوى التأسيسي – Breakthrough Chess Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFDF7;--card:#fff;--ink:#3b3b4f;--o:#FF9F43;--g:#58CC78;--b:#3AA0FF;--lt:#FFF3D6;--dk:#8FD3A8;--soft:#F3F4F8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181f;--card:#23252f;--ink:#f2f2f7;--soft:#2c2e3a}}
:root[data-theme="dark"]{--bg:#17181f;--card:#23252f;--ink:#f2f2f7;--soft:#2c2e3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Fredoka,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:12px;padding:4px 2px}
header h1{font-size:18px;margin:0;flex:1}header small{display:none}
.bar{height:10px;border-radius:9px;background:var(--soft);margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.chip{cursor:pointer;padding:4px 12px;border-radius:99px;background:var(--soft);font-weight:700;font-size:13px}
.chip.on{background:var(--o);color:#fff}
.en{display:inline-block;direction:ltr;font-family:Fredoka,sans-serif;font-weight:600;background:#E6F4FF;color:#1b6fb5;border-radius:10px;padding:0 8px;margin:0 3px}
.layout{display:grid;gap:14px}
.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 4px 18px rgba(60,60,90,.08)}
.card h2{margin:0 0 6px;font-size:24px}
.card p{font-size:19px;line-height:2;margin:6px 0}
.coach{display:flex;gap:10px;align-items:center;margin:10px 0}
.mascot{width:58px;height:58px;flex:none;animation:float 2.5s infinite}.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.bubble{flex:1;background:#FFF1DC;color:#3b3b4f;border-radius:20px;padding:8px 14px;font-weight:700}
.bubble.bad{background:#FFE3E3}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px var(--o)}}
@keyframes tw{50%{opacity:.4;transform:scale(.75)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;margin:auto;border-radius:22px;overflow:hidden;direction:ltr;box-shadow:0 6px 20px rgba(60,60,90,.15)}
.sq{aspect-ratio:1;display:grid;place-items:center;position:relative;font-size:clamp(24px,8vw,40px);line-height:1;cursor:pointer;user-select:none}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq.hl{animation:pulse 1.1s infinite}
.sq.sel{background:#FFE066!important}
.sq.dot::after{content:"";width:30%;height:30%;border-radius:50%;background:var(--b);position:absolute;animation:tw 1s infinite}
.sq.cap::after{content:"";position:absolute;inset:8%;border:4px solid #FF6B6B;border-radius:50%}
.co{position:absolute;font:700 10px Fredoka,sans-serif;color:#3b3b4f;opacity:.55}
.co.f{bottom:1px;right:3px}.co.r{top:1px;left:3px}
.pc{display:grid;place-items:center;width:82%;height:82%;border-radius:50%;animation:pop .3s;color:#3b3b4f;background:#fff;border:3px solid #cbd5e1}
.pc.b{background:#4b5563;border-color:#374151;color:#fff}
.star{position:absolute;font-size:70%;animation:tw 1.2s infinite}
.goal{position:absolute;inset:1%;display:grid;place-items:center;pointer-events:none;z-index:1;animation:pop .3s}
.star.big{inset:1%;display:grid;place-items:center}
.goal svg,.star.big svg{width:100%;height:100%;overflow:visible}
.btn{font:inherit;font-weight:800;border:0;border-radius:99px;padding:12px 28px;cursor:pointer;color:#fff;background:var(--o);margin:8px 4px 0;font-size:17px}
.btn.alt{background:var(--g)}
.btn:active{transform:scale(.96)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pcard{border-radius:20px;padding:10px;text-align:center;background:var(--soft);animation:pop .4s backwards}
.pcard .g{font-size:40px;line-height:1.1}
.pcard small{display:block;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(30,30,50,.5);display:grid;place-items:center;z-index:9;padding:16px}
.modal>div{background:var(--card);color:var(--ink);border-radius:32px;padding:26px;text-align:center;max-width:340px;animation:pop .45s}
.big{font-size:54px;letter-spacing:6px;color:var(--o)}
.conf{position:fixed;top:-20px;font-size:26px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:10}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.brand{height:46px;width:auto;flex:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{filter:invert(1)}}:root[data-theme="dark"] .brand{filter:invert(1)}
.pc{background:none!important;border:0!important;width:98%;height:98%}.pc svg{width:100%;height:100%;overflow:visible}.pcard .g svg{width:64px;height:64px}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left))}
.card p{font-size:clamp(16px,4.4vw,19px)}.card h2{font-size:clamp(20px,6vw,24px)}
.board{max-width:min(100%,72vh)}
.btn,.lrow,.spk{min-height:48px}.chip{min-height:36px;display:inline-flex;align-items:center}
.modal{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.modal>.drawer{background:var(--card);color:var(--ink);border-radius:28px;padding:18px;width:min(380px,100%);max-width:380px;max-height:85vh;overflow:auto;text-align:center}
.lrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);color:var(--ink);font:inherit;font-weight:700;border-radius:18px;padding:10px 14px;margin:6px 0;cursor:pointer}
.lrow.on{background:var(--o);color:#fff}
.spk{border:0;background:var(--soft);border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;vertical-align:middle}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .45s}
@media(min-width:760px) and (orientation:landscape){.wrap{max-width:980px}.layout{grid-template-columns:1fr 1fr;align-items:start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.pin{font:inherit;font-size:24px;text-align:center;width:120px;padding:8px;border-radius:14px;border:3px solid #cbd5e1;margin:6px 0;background:#fff;color:#1e293b}
.pin.nm{width:100%;font-size:16px;margin:0 0 10px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.bdg{border-radius:20px;padding:10px 6px;background:rgba(128,128,128,.15);opacity:.7;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.bdg.on{opacity:1;background:linear-gradient(145deg,var(--c),rgba(255,255,255,.55));box-shadow:0 4px 12px rgba(0,0,0,.15);animation:pop .5s;color:#1e293b}
.bi{font-size:38px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#fff;border:4px solid var(--c,#ccc)}
.bdg.on .bi{box-shadow:0 0 0 4px rgba(255,255,255,.6),0 0 18px var(--c)}
.big1{width:150px;margin:8px auto;padding:16px}.big1 .bi{font-size:62px;width:100px;height:100px}
.spin{animation:spin 1.2s ease-out}@keyframes spin{from{transform:rotate(-360deg) scale(.2)}to{transform:none}}
.prow{display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px dashed rgba(128,128,128,.45);text-align:start}
.arrow{position:absolute;top:2%;font-size:min(7vw,30px);animation:bob .7s infinite;z-index:3;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
@keyframes bob{50%{transform:translateY(8px)}}
button.chip{font:inherit;font-weight:700;font-size:13px;color:inherit}button.chip:not(.on){background:transparent}
.hello{text-align:center;font-weight:800;font-size:clamp(18px,5vw,22px);margin:4px 0 2px}
.lockc{opacity:.55}
.bwrap{display:grid;grid-template-columns:auto 1fr;gap:3px 4px;width:100%;max-width:min(100%,72vh);margin:auto;direction:ltr;align-items:stretch}
.bwrap .board{max-width:none;margin:0}
.ranks{display:grid;grid-template-rows:repeat(8,1fr)}.ranks span{display:grid;place-items:center;padding:0 1px}
.files{grid-column:2;display:grid;grid-template-columns:repeat(8,1fr)}.files span{text-align:center}
.ranks span,.files span{font:700 clamp(12px,3.4vw,16px) Fredoka,sans-serif;color:var(--ink);opacity:.85}
.sq.dot::after{box-shadow:0 0 0 3px rgba(255,255,255,.85)}
button.chip.gear{background:var(--soft);font-size:18px;padding:2px 10px;line-height:1}
.mnbk{position:fixed;inset:0;z-index:40}
.mnu{position:absolute;top:calc(100% + 6px);left:0;z-index:41;width:min(340px,calc(100vw - 28px));max-height:80vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:22px;padding:14px;box-shadow:0 10px 34px rgba(30,30,60,.3);animation:pop .25s;text-align:start}
.mnu h3{margin:4px 0 8px;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.mopt{display:flex;align-items:center;gap:8px;border:2px solid transparent;background:var(--soft);color:var(--ink);font:inherit;font-weight:700;font-size:13px;border-radius:14px;padding:6px 8px;cursor:pointer;min-height:50px;text-align:start}
.mopt.on{border-color:var(--o);background:rgba(255,159,67,.22)}
.mpv{flex:none;display:grid;place-items:center;width:38px;height:38px;font-size:24px}.mpv svg{width:100%;height:100%;overflow:visible}
.msw{flex:none;width:38px;height:38px;border-radius:8px;background:conic-gradient(var(--b) 25%,var(--a) 0 50%,var(--b) 0 75%,var(--a) 0);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
/* ===== Academy theme: navy + gold ===== */
:root{--bg:#F5F1E8;--card:#fff;--ink:#1F2A44;--soft:#EDEFF4;--o:#1F2A44;--on:#fff;--hd:#1F2A44;--gold:#E0A526;--g:#2FAE6B;--b:#2F6FDE;--ln:rgba(31,42,68,.1);--pat:rgba(31,42,68,.035)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151F;--card:#1C2130;--ink:#EEF0F7;--soft:#262C3F;--o:#E0A526;--on:#1a1d2b;--hd:#F3C969;--ln:rgba(255,255,255,.1);--pat:rgba(255,255,255,.03)}}
:root[data-theme="dark"]{--bg:#12151F;--card:#1C2130;--ink:#EEF0F7;--soft:#262C3F;--o:#E0A526;--on:#1a1d2b;--hd:#F3C969;--ln:rgba(255,255,255,.1);--pat:rgba(255,255,255,.03)}
body{background-color:var(--bg);background-image:conic-gradient(var(--pat) 25%,transparent 0 50%,var(--pat) 0 75%,transparent 0);background-size:64px 64px}
header{background:var(--card);border-radius:20px;padding:8px 14px;margin-bottom:10px;border:1px solid var(--ln);border-bottom:4px solid var(--gold);box-shadow:0 6px 18px rgba(31,42,68,.08)}
header h1{font-size:17px;font-weight:800;color:var(--hd)}
.card{border-radius:22px;border:1px solid var(--ln);box-shadow:0 3px 0 var(--ln),0 14px 30px rgba(31,42,68,.08)}
.card h2{color:var(--hd)}
.chip{border:1px solid var(--ln);background:var(--card)}
.chip.on,button.chip.on{background:var(--o);color:var(--on);border-color:transparent}
button.chip:not(.on){background:var(--card)}button.chip.gear{background:var(--card)}
.btn{background:var(--o);color:var(--on);border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.btn.alt{background:var(--g);color:#fff;box-shadow:0 4px 0 #1f7f4c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.en{background:#FBF0D3;color:#8A5A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .en{background:rgba(224,165,38,.18);color:#F3C969}}
:root[data-theme="dark"] .en{background:rgba(224,165,38,.18);color:#F3C969}
.bubble{background:#FBF0D3;border:1px solid rgba(224,165,38,.45)}.bubble.bad{background:#FFE3E3;border-color:#f5a3a3}
.bar{height:8px;background:var(--ln)}.bar i{background:linear-gradient(90deg,var(--gold),var(--g))}
.board{border:5px solid #1F2A44;border-radius:12px;box-shadow:0 10px 26px rgba(31,42,68,.28)}
.ranks{padding:5px 0}.files{padding:0 5px}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px var(--g)}}
.bdw{position:relative}.arw{position:absolute;left:5px;top:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;overflow:visible}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--ln);cursor:pointer;padding:0}.cdot.on{box-shadow:0 0 0 3px var(--ink)}
.big{color:var(--gold)}
.mopt.on{border-color:var(--gold)}
.hello{color:var(--hd)}
.pcard{border:1px solid var(--ln);background:var(--card)}
.modal>div,.modal>.drawer{border:1px solid var(--ln);border-top:5px solid var(--gold)}

/* ===== Live monitor (coach) ===== */
.modal>.lvbox{max-width:min(1100px,100%);width:100%;padding:16px;text-align:right;max-height:92vh;overflow:auto;border-radius:24px}
.lvtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lvtop h2{margin:0;flex:1;font-size:20px}
.lvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.lvc{background:var(--soft);border-radius:18px;padding:8px;cursor:pointer;border:2px solid transparent;text-align:right}
.lvc:hover{border-color:var(--gold)}.lvc.off{opacity:.55}
.lvh{display:flex;align-items:center;gap:6px;font-size:14px}.lvh i{width:10px;height:10px;border-radius:50%;flex:none}
.mini .ranks,.mini .files{display:none}.mini .bwrap{display:block}
.mini .board{border-width:2px;border-radius:8px;box-shadow:none}.mini .sq{font-size:13px}.mini .co{display:none}
.lvs{font-weight:800;font-size:13px;margin:5px 0 0}
.lvt{font-size:12px;opacity:.85;line-height:1.4;min-height:2.8em}
.lvhist{display:flex;flex-wrap:wrap;gap:3px;direction:ltr;justify-content:flex-end;min-height:20px}
.lvhist span{font:600 11px Fredoka,sans-serif;padding:1px 6px;border-radius:99px;background:var(--card)}
.lvn{font-size:13px;margin:8px 0;padding:10px;border-radius:14px;background:var(--soft);line-height:1.8}
</style>

  {shr&&role==='coach'&&grp&&(()=>{const u=BASE+'?'+qs({code:grp}),msg='♟️ أهلاً بك في Breakthrough Chess Academy!'+(gname?'\n👥 '+gname:'')+'\nادخل على الرابط واكتب اسمك:\n'+u+'\n\n🔑 كود الحصة: '+grp,
   doCopy=t=>{const done=ok=>setShr({ok});try{navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false))}catch(e){done(false)}},
   doShare=async()=>{try{if(navigator.share)await navigator.share({title:'حصة الشطرنج',text:msg});else doCopy(msg)}catch(e){}};
   return <div className="modal" style={{zIndex:30}} onClick={()=>setShr(null)}><div className="drawer" onClick={e=>e.stopPropagation()}>
   <h2 style={{margin:'0 0 8px'}}>📤 مشاركة {gname||'الحصة'}</h2><p style={{fontSize:13,margin:'0 0 8px',opacity:.85}}>الرابط شغّال بعد الحصة كمان: المتدرب يدخل ويحلّ الواجب والدروس المفتوحة بس 👍</p>
   <p style={{margin:'0 0 4px',fontWeight:800}}>🔑 كود الحصة</p>
   <div style={{fontSize:40,fontWeight:900,letterSpacing:6,direction:'ltr',margin:'0 0 8px'}}>{grp}</div>
   <p style={{margin:'0 0 4px',fontWeight:800}}>🔗 رابط الدخول (الكود داخله تلقائيًا)</p>
   <input className="pin nm" dir="ltr" readOnly value={u} onFocus={e=>e.target.select()}/>
   {shr.ok!==null&&<p style={{margin:'4px 0',fontWeight:800}}>{shr.ok?'تم النسخ ✅':'تعذّر النسخ، انسخ الرابط يدويًا 👆'}</p>}
   <div><button className="btn" onClick={()=>window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}>🟢 إرسال عبر واتساب</button>
   <button className="btn alt" onClick={()=>doCopy(msg)}>📋 نسخ الرسالة (رابط + كود)</button>
   <button className="btn alt" onClick={()=>doCopy(u)}>🔗 نسخ الرابط فقط</button>
   {navigator.share&&<button className="btn alt" onClick={doShare}>📲 مشاركة...</button>}
   <button className="btn" onClick={()=>setShr(null)}>إغلاق</button></div></div></div>})()}
  {gm&&role==='coach'&&<div className="modal" style={{zIndex:30}} onClick={()=>setGm(false)}><div className="drawer" style={{textAlign:'right'}} onClick={e=>e.stopPropagation()}>
    <h2 style={{margin:'0 0 4px',textAlign:'center'}}>👥 جروباتي</h2>
    <p style={{fontSize:13,margin:'0 0 8px',textAlign:'center',opacity:.85}}>لكل جروب كود ورابط. ابعته للمتدربين عشان يدخلوا حتى بعد الحصة 📲</p>
    {cgs.map(g=><div key={g.c} style={{display:'flex',gap:6,alignItems:'center'}}><button className={'lrow'+(g.c===grp?' on':'')} style={{flex:1}} onClick={()=>{setGrp(g.c);setGm(false)}}><span>{g.c===grp?'✅':'⭕'}</span><span style={{flex:1,textAlign:'right'}}>{g.n}</span><span className="en">{g.c}</span></button><button className="chip" aria-label="إرسال الرابط" onClick={()=>{setGrp(g.c);setGm(false);setShr({ok:null})}}>📤</button><button className="chip" aria-label="حذف من القائمة" onClick={()=>{if(window.confirm('حذف الجروب «'+g.n+'» من قائمتك؟')){setCgs(a=>a.filter(x=>x.c!==g.c));if(g.c===grp){const o=cgs.find(x=>x.c!==g.c);setGrp(o?o.c:genCode())}}}}>🗑</button></div>)}
    <input className="pin nm" style={{marginTop:10}} placeholder="اسم الجروب الجديد (مثال: سبت 5م)" value={ngn} maxLength={30} onChange={e=>setNgn(e.target.value)}/>
    <div style={{textAlign:'center'}}><button className="btn" onClick={()=>{const n=ngn.trim()||'جروب '+(cgs.length+1),c=genCode();setCgs(a=>[...a,{c,n}]);setGrp(c);setNgn('');setGm(false);setShr({ok:null})}}>➕ إنشاء جروب وإرسال الرابط</button><button className="btn alt" onClick={()=>setGm(false)}>إغلاق</button></div></div></div>}
   {img&&<div className="modal" style={{zIndex:30}} onClick={()=>setImg(null)}><div className="drawer" onClick={e=>e.stopPropagation()}>
   <h2 style={{margin:'0 0 8px'}}>🖼️ تقرير الإنجازات</h2>
   <img src={img} alt="تقرير الإنجازات" style={{width:'100%',borderRadius:16,boxShadow:'0 4px 14px rgba(0,0,0,.15)'}}/>
   <p style={{fontSize:14,margin:'8px 0'}}>اضغط مطولاً على الصورة لحفظها، ثم أرسلها عبر الواتساب 📲</p>
   <div><button className="btn alt" onClick={shareImg}>📤 مشاركة الصورة</button><button className="btn" onClick={()=>setImg(null)}>إغلاق</button></div></div></div>}
  {lv&&role==='coach'&&<LiveView feed={st.stu} onClose={()=>setLv(false)}/>}
  {rs&&role==='coach'&&<div className="modal" onClick={()=>setRs(false)}><div className="drawer" style={{textAlign:'right'}} onClick={e=>e.stopPropagation()}><h2 style={{margin:'0 0 4px',textAlign:'center'}}>👥 متابعة الطلاب</h2>{SHEET_URL&&<div style={{textAlign:'center'}}><button className="btn" onClick={syncRos}>🔄 تحديث من Google Sheets</button></div>}<p style={{fontSize:13,margin:'0 0 8px',textAlign:'center',opacity:.8}}>الصق رسالة التقرير (أو رابط المتابعة) الذي أرسله ولي الأمر لتظهر حالة الطالب هنا</p>
   <textarea className="pin nm" dir="rtl" style={{height:70,fontSize:14,textAlign:'right'}} placeholder="الصق التقرير أو الرابط هنا" value={pt} onChange={e=>{setPt(e.target.value);setPm('')}}/>
   <div style={{textAlign:'center'}}><button className="btn" onClick={()=>{const r=parseRep(pt);if(!r)return setPm('❌ لم أتعرف على التقرير، تأكد من لصق الرسالة كاملة');ROS.put(r);setPt('');setPm('✅ تم حفظ '+r.n);setRv(v=>v+1)}}>➕ إضافة / تحديث</button></div>
   {pm&&<p style={{fontSize:13,textAlign:'center',margin:'4px 0'}}>{pm}</p>}
   {ROS.get().length===0?<p style={{textAlign:'center',opacity:.7,margin:'12px 0'}}>لا يوجد طلاب بعد</p>:ROS.get().map(r=>{const fin=r.pct>=100,d=new Date(r.t||Date.now());return <div key={r.n} style={{borderTop:'1px dashed rgba(128,128,128,.45)',padding:'8px 2px'}}>
    <div style={{display:'flex',justifyContent:'space-between',gap:8,alignItems:'center'}}><b>{fin?'🎓':'♟️'} {r.n}</b><span style={{cursor:'pointer',opacity:.6}} onClick={()=>{ROS.del(r.n);setRv(v=>v+1)}}>🗑️</span></div>
    <div className="bar"><i style={{width:r.pct+'%'}}/></div>
    <div style={{fontSize:13,display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:4}}><span>{r.pct}% · {fin?'أنهى المستوى 🎉':'وصل إلى الدرس '+r.lesson+' ('+LN[r.lesson-1]+')'}</span><span>⭐ {r.stars} · 🏅 {r.b}/{LN.length}</span></div>
    <div style={{fontSize:11,opacity:.6}}>آخر تحديث: {d.toLocaleDateString('ar-EG')}</div></div>})}
   <p style={{fontSize:11,opacity:.65,textAlign:'center',margin:'8px 0 0'}}>القائمة تُحفظ على جهاز المدرب فقط. عند فتح رابط متابعة وأنت مسجّل كمدرب يُضاف الطالب تلقائياً.</p>
   <div style={{textAlign:'center'}}><button className="btn" onClick={()=>setRs(false)}>إغلاق</button></div></div></div>}
  {hwm&&role==='student'&&<div className="modal" onClick={()=>setHwm(false)}><div className="drawer" style={{textAlign:'right'}} onClick={e=>e.stopPropagation()}>
   <h2 style={{margin:'0 0 4px',textAlign:'center'}}>📝 الواجب والمهام</h2>
   {hw.length===0?<p style={{textAlign:'center',opacity:.8}}>لا يوجد واجب حالياً 🎉</p>:<><p style={{fontSize:13,margin:'0 0 6px',textAlign:'center',opacity:.8}}>{hwDone} / {hw.length} مهام محلولة{locked?' · 🔒 يُفتح الواجب بعد انتهاء الحصة':''}</p>
   {hw.map(t=><button key={t} className="lrow" disabled={locked} style={locked?{opacity:.55}:null} onClick={()=>{setI(t);setHwm(false)}}><span>{dn.includes(t)?'✅':'⭕'}</span><span className="en" style={{minWidth:70}}>{LN[STEPS[t].L]}</span><span style={{flex:1,textAlign:'right'}}>{STEPS[t].t}</span></button>)}</>}
   <h3 style={{margin:'12px 0 4px',fontSize:15,textAlign:'center'}}>📚 مهام الدروس المفتوحة</h3>
    {LN.map((n,k)=>{if(lockK(k))return null;const ts=TASKS.filter(t=>STEPS[t].L===k);if(!ts.length)return null;const d2=ts.filter(t=>dn.includes(t)).length,nx=ts.find(t=>!dn.includes(t));return <button key={'ls'+k} className="lrow" disabled={locked} style={locked?{opacity:.55}:null} onClick={()=>{setI(nx!==undefined?nx:ts[0]);setHwm(false)}}><span>{d2===ts.length?'✅':'▶️'}</span><span className="en" style={{minWidth:70}}>{n}</span><span style={{flex:1,textAlign:'right'}}>مهام الدرس {k+1} ({d2}/{ts.length})</span></button>})}
    {gated&&<p style={{fontSize:12,textAlign:'center',opacity:.8,margin:'6px 0'}}>🔒 الدروس الجديدة تُفتح عندما يبدأها المدرب</p>}
    <div style={{textAlign:'center'}}><button className="btn alt" onClick={()=>setHwm(false)}>إغلاق</button></div></div></div>}
  {cl&&role==='coach'&&<div className="modal" onClick={()=>setCl(false)}><div className="drawer" style={{textAlign:'right'}} onClick={e=>e.stopPropagation()}><h2 style={{margin:'0 0 4px',textAlign:'center'}}>📋 كل المواقف</h2><p style={{fontSize:13,margin:'0 0 6px',textAlign:'center',opacity:.8}}>اضغط على أي موقف لفتحه · 🆕 = موقف جديد · ✅ = محلول</p><p style={{fontSize:13,margin:'0 0 6px',textAlign:'center',fontWeight:800}}>📝 اضغط على الزرار اللي بجانب الموقف لإضافته للواجب (المختار: {hw.length}){hw.length>0&&<> · <span style={{cursor:'pointer',textDecoration:'underline'}} onClick={()=>setHw([])}>مسح الكل</span></>}{!RT.mode&&<><br/>⚠️ المزامنة غير مفعّلة، الواجب لن يصل للمتدربين</>}</p>
   {LN.map((n,k)=><div key={k}><h3 style={{margin:'10px 0 2px',fontSize:15}}>الدرس {k+1} · <span className="en">{n}</span> ({TASKS.filter(t=>STEPS[t].L===k).length})</h3>{TASKS.filter(t=>STEPS[t].L===k).map(t=><div key={t} style={{display:'flex',gap:6,alignItems:'center'}}><button className={'lrow'+(i===t?' on':'')} style={{flex:1}} onClick={()=>{setI(t);setCl(false)}}><span>{dn.includes(t)?'✅':ISNEW[t]?'🆕':'⭕'}</span><span style={{flex:1,textAlign:'right'}}>{STEPS[t].t}</span></button><button className={'chip'+(hw.includes(t)?' on':'')} aria-label="إضافة للواجب" onClick={()=>setHw(hw.includes(t)?hw.filter(x=>x!==t):[...hw,t].sort((a,b)=>a-b))}>{hw.includes(t)?'📝 ✓':'📝'}</button></div>)}</div>)}
   <div style={{textAlign:'center'}}><button className="btn alt" onClick={()=>setCl(false)}>إغلاق</button></div></div></div>}
  {ach&&<div className="modal" onClick={()=>setAch(false)}><div className="drawer" onClick={e=>e.stopPropagation()}><h2 style={{margin:'0 0 4px'}}>🏅 خزانة الأوسمة</h2><p style={{margin:'0 0 6px'}}>{nDone} / {LN.length}</p>
   <div className="bgrid">{BG.map((b,k)=><div key={k} className={'bdg'+(earned[k]?' on':'')} style={{'--c':BC[k]}}><div className="bi">{earned[k]?b[0]:'🔒'}</div><b>{b[1]}</b><span className="en">{LN[k]}</span></div>)}</div>
   <button className="btn alt" onClick={()=>setAch(false)}>إغلاق</button></div></div>}
  {nb!==null&&<div className="modal"><Confetti/><div className="drawer"><div style={{fontWeight:800}}>🎉 وسام جديد!</div><div className="bdg on big1" style={{'--c':BC[nb]}}><div className="bi spin">{BG[nb][0]}</div></div><h2 style={{margin:'4px 0'}}>{BG[nb][1]}</h2><p style={{margin:'4px 0'}}>أتممت درس <span className="en">{LN[nb]}</span> بنجاح!</p><div><a className="btn alt" style={{display:'inline-block',textDecoration:'none'}} href={waCong(nb)} target="_blank" rel="noopener noreferrer">📲 أرسل التهنئة عبر الواتساب</a></div><button className="btn" onClick={()=>{setSeen(x=>[...x,nb]);setNb(null)}}>رائع! ➜</button></div></div>}
  {dr&&<div className="modal" onClick={()=>setDr(false)}><div className="drawer" onClick={e=>e.stopPropagation()}><h2 style={{margin:'0 0 4px'}}>اختر الدرس 📚</h2><p style={{fontSize:13,margin:'0 0 6px',opacity:.8}}>{gated?'الدرس الجديد يفتحه المدرب في الحصة 🔓':'أكمل مهام كل درس لتفتح الدرس التالي 🔓'}</p>
   {LN.map((n,k)=>{const first=STEPS.findIndex(x=>x.L===k),last=STEPS.map(x=>x.L).lastIndexOf(k),cur=s&&s.L===k;
    const lk2=lockK(k);return <button key={k} disabled={lk2} style={lk2?{opacity:.55}:null} className={'lrow'+(cur?' on':'')} onClick={()=>{setI(first);setDr(false)}}><span>{lk2?'🔒':i>last?'✅':cur?'▶️':'⭕'}</span><span>الدرس {k+1}</span><span className="en">{n}</span></button>})}
   <button className="btn alt" onClick={()=>setDr(false)}>إغلاق</button></div></div>}
 </div></SC.Provider>)
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
